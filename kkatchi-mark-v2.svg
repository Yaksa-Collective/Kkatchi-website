<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 610" role="img" aria-labelledby="title desc">
  <title id="title">Kkatchi since 1983</title>
  <desc id="desc">An arched dark green badge with a simple cream flying magpie and Korean and English Kkatchi lettering.</desc>
  <path fill="#f1e4bd" d="M260 9C123 9 12 120 12 257v341h496V257C508 120 397 9 260 9Z"/>
  <path fill="#caa85d" d="M260 17C128 17 20 125 20 257v333h480V257C500 125 392 17 260 17Z"/>
  <path fill="#f6f0dc" d="M260 25C132 25 28 129 28 257v325h464V257C492 129 388 25 260 25Z"/>
  <path fill="#102d28" d="M260 35C138 35 38 135 38 257v315h444V257C482 135 382 35 260 35Z"/>

  <text x="260" y="92" fill="#e6cf91" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" letter-spacing="5">추억 담긴 가게</text>
  <text x="260" y="129" fill="#e6cf91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="8">KKACHI</text>
  <circle cx="75" cy="181" r="5" fill="#e6cf91"/>
  <circle cx="445" cy="181" r="5" fill="#e6cf91"/>

  <!-- Three simple pieces reproduce the original keyring bird. -->
  <g transform="matrix(.9 0 0 .9 0 28)" fill="#e6cf91" stroke="#102d28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- broad body and stepped tail feathers -->
    <path d="M112 272h151c47 0 81 18 91 43-10 26-44 44-91 44H112l25-22h43l-29-17h48l-34-18h42l-31-16h-39Z"/>

    <!-- upper four-feather fan -->
    <path d="M321 302c-7-29-7-63 0-96 17 0 34 7 47 19 6-15 20-12 31-2 11 9 18 22 21 38 8-12 21-7 27 4 7 14 5 31-7 46-38-9-79-10-119-9Z"/>

    <!-- lower three-feather fan -->
    <path d="M323 328c-4 30-2 61 7 91 18-2 34-10 46-23 7 14 21 10 31 0 10-11 16-24 17-39 10 10 22 3 27-9 5-14 1-30-12-43-38 13-77 19-116 23Z"/>

    <!-- round head and breast -->
    <path d="M349 315c19-9 31-28 48-40 22-16 55-11 70 11l19 11-20 8c-8 27-33 45-61 44-27-1-47-15-56-34Z"/>
  </g>

  <!-- feather divisions, like the dark grooves on the keyring -->
  <g transform="matrix(.9 0 0 .9 0 28)" fill="none" stroke="#102d28" stroke-width="6" stroke-linecap="round">
    <path d="M328 224c22 8 42 22 57 41"/>
    <path d="M326 244c22 7 41 20 56 38"/>
    <path d="M325 265c18 6 34 16 47 29"/>
    <path d="M333 399c19-9 35-23 46-40"/>
    <path d="M330 378c18-8 33-20 44-35"/>
  </g>
  <circle cx="394.2" cy="290.8" r="5.4" fill="#102d28"/>

  <text x="78" y="267" fill="#e6cf91" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7" transform="rotate(-90 78 267)">SINCE</text>
  <text x="458" y="267" fill="#e6cf91" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7" transform="rotate(90 458 267)">1983</text>

  <line x1="77" y1="426" x2="443" y2="426" stroke="#caa85d" stroke-width="2"/>
  <text x="260" y="520" fill="#e6cf91" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="91" font-weight="900" letter-spacing="-6">까치네</text>
</svg>
